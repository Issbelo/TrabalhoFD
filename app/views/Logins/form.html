#{extends 'main.html' /}
#{set title:'Acesso ao Sistema - Login' /}

<div style="max-width: 350px; margin: 50px auto; font-family: Arial, sans-serif;">
    <h2>Área de Acesso</h2>

    *{ Exibição de mensagens de erro ou sucesso }*
    #{if flash.error}
        <div style="color: red; margin-bottom: 10px;">
            ${flash.error}
        </div>
    #{/if}
    #{if flash.success}
        <div style="color: green; margin-bottom: 10px;">
            ${flash.success}
        </div>
    #{/if}

    <form action="@{Logins.logar()}" method="post">
        <p>
            <label for="login">Login:</label><br>
            <input type="text" id="login" name="login" required style="width: 100%; padding: 8px;">
        </p>
        
        <p>
            <label for="senha">Senha:</label><br>
            <input type="password" id="senha" name="senha" required style="width: 100%; padding: 8px;">
        </p>

        <p>
            <input type="submit" value="Entrar" style="width: 100%; padding: 10px; cursor: pointer;">
        </p>
    </form>
</div>
