#{extends 'main.html' /}

<header>
    <div class="topo">
        <div class="logo">
            #{if p?.id}
                #{set title:'Editar produto' /}
                <h1>Editar produto</h1>
            #{/if}
            #{else}
                #{set title:'Cadastro de produto' /}
                <h1>Cadastrar produto</h1>
            #{/else}
        </div>
    </div>

    <nav>
        <a class="atual" href="#">Cadastrar novo produto</a>
        <a href="@{Fornecedores.form()}">Cadastrar novo fornecedor</a>
        <a href="@{Fornecedores.listar()}">Lista de fornecedores</a>
        <a href="@{Produtos.listar()}">Lista de produtos</a>
    </nav>
</header>

<div class="corpo">
    <form action="@{Produtos.salvar()}">
        <input type="hidden" name="p.id" value="${p.id}">

        <label for="nome">Nome:</label>
        <input
            type="text"
            id="nome"
            name="p.nome"
            value="${p.nome}"
            required
        >

        <label for="descricao">Descrição:</label>
        <textarea
            id="descricao"
            name="p.descricao"
            rows="4"
            cols="50"
            placeholder="Descreva o produto..."
        >${p.descricao}</textarea>

        <label for="precoFormatado">Preço (R$):</label>
        <input
            type="text"
            id="precoFormatado"
            placeholder="0,00"
            inputmode="decimal"
            autocomplete="off"
            required
        >
        <input
            type="hidden"
            id="precoNumerico"
            name="p.preco"
            value="${p.preco}"
        >

        <label for="quantidade">Quantidade:</label>
        <input
            type="number"
            id="quantidade"
            name="p.quantidade"
            step="1"
            value="${p.quantidade}"
            required
        >

        <label for="categoria">Categoria:</label>
        <select id="categoria" name="p.categoria" required>
            <option value="Moda" ${p.categoria == 'Moda' ? 'selected' : ''}>Moda</option>
            <option value="Tecnologia" ${p.categoria == 'Tecnologia' ? 'selected' : ''}>Tecnologia</option>
            <option value="Casa" ${p.categoria == 'Casa' ? 'selected' : ''}>Casa</option>
            <option value="Outros" ${p.categoria == 'Outros' ? 'selected' : ''}>Outros</option>
        </select>

        <label for="fornecedor">Fornecedor:</label>
        <select id="fornecedor" name="p.fornecedor.id">
            #{list items:listaF, as:'f'}
                <option value="${f.id}" ${f.id == p.fornecedor?.id ? 'selected' : ''}>
                    ${f.nome}
                </option>
            #{/list}
        </select>

        <input type="submit" value="Salvar">
    </form>
</div>

<script>
(function () {
    var campoFormatado = document.getElementById("precoFormatado");
    var campoNumerico = document.getElementById("precoNumerico");

    function mostrarPreco(valor) {
        var numero = parseFloat(valor);

        if (isNaN(numero)) {
            numero = 0;
        }

        return numero.toLocaleString("pt-BR", {
            minimumFractionDigits: 2,
            maximumFractionDigits: 2
        });
    }

    function atualizarPreco() {
        var digitos = campoFormatado.value.replace(/\D/g, "");

        if (digitos.length === 0) {
            campoFormatado.value = "";
            campoNumerico.value = "";
            return;
        }

        var valor = parseInt(digitos, 10) / 100;

        campoFormatado.value = mostrarPreco(valor);
        campoNumerico.value = valor.toFixed(2);
    }

    campoFormatado.value = mostrarPreco(campoNumerico.value);
    campoFormatado.addEventListener("input", atualizarPreco);
    campoFormatado.addEventListener("focus", function () {
        campoFormatado.select();
    });
})();
</script>
